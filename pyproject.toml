[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-storage"
version = "0.2.0"
description = "Research-data storage triage: read-only stat-only scan + referenced-file-aware rotation of versioned build artifacts (e.g. SIF images)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
keywords = ["storage", "data-management", "disk-usage", "research-data", "science"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "click",
    "scitex-ssh>=1.2.0",
    # `document-sorter` reads a searchable PDF's embedded text layer. pypdf is
    # pure-Python (no system binary, unlike fd/fclones/rsync), so it belongs
    # in the base install: `pip install scitex-storage` must be able to run
    # the document pipeline. Chosen over pdfminer.six as the lighter reader
    # for text-layer extraction (the only PDF operation this package does).
    "pypdf>=4.0",
    "pyyaml>=6.0",
]
# NOTE: three SYSTEM (non-pip) runtime dependencies, each required by ONE
# verb: `fd` (fd-find) for `scan`'s directory traversal, `fclones` for
# `find-duplicates`' size+hash detection, and `rsync` for `archive`/
# `restore`'s transport (see src/scitex_storage/_scan.py, _duplicates.py,
# _archive.py, and _system_deps.py). None is a PyPI package, so none belongs
# in `dependencies` above; all are declared to the scitex-dev system-deps
# federation via the `scitex_dev.system_deps` entry-point below. `pip install
# scitex-storage` never requires them -- each verb raises a clear
# MissingSystemDependencyError (install instructions included) if its binary
# is missing, rather than failing to install or silently falling back to a
# slow pure-Python walk/hash. See README.md "Installation" for
# platform-specific install commands.
#
# `scitex-ssh` below is a hard PyPI dependency because archive tiering has no
# meaning without a transport -- but note it is the ADAPTER, not the
# transport: its `sync_dir` is a wrapper over `rsync -a` over ssh. Declaring
# the adapter while omitting the binary it adapts is how `rsync` went
# undeclared until 2026-07-17, when `archive` turned out not to run in the
# container this package ships to. An import gate cannot catch that class of
# gap: `import scitex_ssh` resolves fine right up until the binary
# underneath is missing.

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "scitex-dev>=0.30.0",  # gui_runtime lives here since 0.30.0
    # Mirror the `gui` runtime extra so `pip install -e .[dev]` runs the
    # full suite. Tests import these unguarded; PS-210 audit invariant.
    "django>=5.0",
    "scitex-app>=0.3.0",
    "scitex-ui>=0.6.4",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
# `scitex-storage[gui]` -- the GUI plugin under src/scitex_storage/_django/
# (installable standalone via `scitex-storage start-gui`, or as a scitex-hub
# plugin mounted at /storage/, following the same scitex-app/scitex-ui
# convention as scitex-writer/scitex-scholar/scitex-todo/figrecipe). Kept
# OUT of the base `dependencies` above -- same spirit as the `fd`/`fclones`
# SYSTEM deps noted below: `pip install scitex-storage` (the CLI) must never
# require Django or these UI packages, only `pip install
# scitex-storage[gui]` does. The one place these are imported is behind an
# isolated adapter module (src/scitex_storage/_django/_app_adapter.py) --
# see that module's docstring for why (scitex-app doesn't have a public
# embedding API yet; tracked as scitex-dev card
# scitex-app-embedding-api-needed-20260710).
gui = [
    "django>=5.0",
    "scitex-app>=0.3.0",
    "scitex-ui>=0.6.4",
    "scitex-dev>=0.30.0",  # gui_runtime, used by the gui {open,serve,status,stop} group at runtime
]
all = [
    "scitex-storage[dev,docs,gui]",
]

[project.scripts]
scitex-storage = "scitex_storage._cli:main"

[project.urls]
Homepage = "https://github.com/scitex-ai/scitex-storage"
Repository = "https://github.com/scitex-ai/scitex-storage"
Issues = "https://github.com/scitex-ai/scitex-storage/issues"
Documentation = "https://scitex-storage.readthedocs.io"

[project.entry-points."scitex_dev.docs"]
scitex-storage = "scitex_storage"

[project.entry-points."scitex_dev.skills"]
scitex-storage = "scitex_storage"

[project.entry-points."scitex_dev.system_deps"]
scitex-storage = "scitex_storage._system_deps:provide"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_storage"]
# Pre-built Sphinx HTML served in-wheel by scitex-cloud (PS-121); refreshed
# by the rtd-sphinx-build CI job on main/develop pushes.
artifacts = [
    "src/scitex_storage/_sphinx_html/**/*",
    "src/scitex_storage/_django/manifest.json",
    "src/scitex_storage/_django/templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[tool.coverage.run]
parallel = true
source = ["scitex_storage"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

# cli-audit-dict.yaml — package-specific additions to the CLI-audit
# noun/verb catalog (audit-cli §1). Additive only: never reclassifies or
# overrides the canonical catalog.
nouns:
  - inode  # why: `inodes` is the standard filesystem term for the on-disk
           # file-record objects a filesystem can run out of independently
           # of free space (cf. `df -i`, whose own header column is
           # "Inodes"). It is a term of art absent from general-English
           # dictionaries, not a coinage. Declared singular: the auditor's
           # own singularizer maps the plural back (inodes -> inode).
intransitive_verbs:
  - scan  # why: matches the design doc's own command name
          # (`scitex-storage scan ~/projects`) and standard filesystem-tool
          # usage (fdupes/rdfind/clamscan all use bare "scan" as a leaf verb).
  - sweep  # why: matches standard filesystem-tool usage (e.g. `fstrim`-style
           # sweep tools use bare "sweep" as a leaf verb); the object is
           # always the DIRECTORY argument, not implied by the verb itself.
  - reclaim  # why: "reclaim" is the standard storage verb for recovering
             # space/inodes (cf. filesystem "reclaim", GC "reclaim", LVM
             # thin-pool "reclaim"). Moby dual-classifies it noun+verb; the
             # verb meaning is the one intended here, and the object is the
             # PATH argument, exactly like `scan`/`sweep`. `reclaim-restore`
             # is a compound whose head `restore` is already canonical, so
             # only the bare `reclaim` leaf needs declaring.
  - survey  # why: "survey a tree" is the intended reading, and the object is
            # the PATH argument exactly as with `scan`/`sweep`/`reclaim`
            # above — the leaf token does not imply its own object. Moby
            # dual-classifies survey noun+verb; the verb meaning is the one
            # used here. Declared rather than renamed BECAUSE THE VERB
            # MEANING IS REAL: contrast `regenerable`, which the same
            # auditor rejected in this package on 2026-07-28 and which was
            # RENAMED to `find-recipe` instead of declared — an adjective
            # has no category here, so declaring it would have been
            # configuring a check to pass rather than fixing a name. This
            # one has a category it genuinely belongs to, and four
            # siblings already in it.
  - run  # why: the `document-sorter run` leaf. "run" is the canonical verb
         # for executing a pipeline once (cf. `airflow dags run`, `dbt run`,
         # `snakemake`-style one-shot runs); the object is the configured
         # inbox, supplied by the `document-sorter` group, not implied by the
         # verb. Moby dual-classifies run noun+verb; the verb reading is the
         # intended one here.

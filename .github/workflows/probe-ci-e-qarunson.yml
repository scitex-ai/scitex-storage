name: probe-ci-e-qarunson

# DIAGNOSTIC PROBE: quality-audit with an explicit runs_on passed.
# If THIS runs while probe-d (no runs_on) startup-fails, the fault is the
# quality-audit default '["ubuntu-latest"]' input resolution through
# scitex-storage's caller context.
on:
  pull_request:
    branches: [develop]

jobs:
  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
    with:
      runs_on: '["ubuntu-latest"]'

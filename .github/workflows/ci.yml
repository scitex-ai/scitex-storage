name: ci

# Org-level reusable-workflow caller (scitex-ai/.github, fleet standard as of
# 2026-07-10 — see scitex-container / scitex-todo for the same pattern).
# Four thin `uses:` calls into scitex-ai/.github reusable workflows instead
# of inlining the job bodies; centrally maintained.
#
# Job ids are chosen so the resulting required-status-check context is
# predictable: "<job id> / <reusable job name>".

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *" # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-matrix:
    # Required-status-check context: "pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  import-smoke:
    # Required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  quality-audit:
    # Required-status-check context: "quality-audit / audit"
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit

  rtd-sphinx-build:
    # Required-status-check context: "rtd-sphinx-build / docs-sphinx"
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main
    secrets: inherit

  # Self-contained (not a shared-org `uses:` call, unlike the four jobs
  # above) -- `scan` shells out to `fd` and `find-duplicates` to `fclones`
  # (see src/scitex_storage/_scan.py / _duplicates.py), and `pytest-matrix`
  # above doesn't install either binary, so the tests that exercise them
  # for real stay skipped there. This job installs both (fast: apt for
  # `fd-find`, the upstream release .deb for `fclones` -- no `cargo build`
  # in CI) and reruns the suite so the real integration paths get CI
  # coverage too.
  fd-fclones-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fd + fclones
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fd-find
          FCLONES_VERSION=0.35.0
          curl -fsSL -o /tmp/fclones.deb \
            "https://github.com/pkolaczk/fclones/releases/download/v${FCLONES_VERSION}/fclones_${FCLONES_VERSION}-1_amd64.deb"
          sudo apt-get install -y /tmp/fclones.deb
          fdfind --version
          fclones --version
      - name: Install scitex-storage[dev]
        run: pip install -e '.[dev]'
      - name: Run tests with fd/fclones on PATH
        run: pytest "$GITHUB_WORKSPACE/tests/" -q

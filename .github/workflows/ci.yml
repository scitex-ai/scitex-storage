name: ci

# Org-level reusable-workflow caller (scitex-ai/.github, fleet standard as of
# 2026-07-10 — see scitex-container / scitex-todo for the same pattern).
# Four thin `uses:` calls into scitex-ai/.github reusable workflows instead
# of inlining the job bodies; centrally maintained.
#
# Job ids are chosen so the resulting required-status-check context is
# predictable: "<job id> / <reusable job name>".

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *" # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-matrix:
    # Required-status-check context: "pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  import-smoke:
    # Required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  quality-audit:
    # Required-status-check context: "quality-audit / audit"
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit

  rtd-sphinx-build:
    # Required-status-check context: "rtd-sphinx-build / docs-sphinx"
    # Pinned to the qualified org revision (2026-10-18): rtd-sphinx-build@main
    # grew publish jobs requesting contents:write/pull-requests:write, which
    # fails startup against this caller's read-only scope. Re-pin when the org
    # ships a caller-permissions contract for the new jobs.
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@8c646081e9f1352077d3d8674052cce7ec75a1b7
    secrets: inherit

  # Keep the real integration suite on the admitted org runner workflow.
  # The pinned callee preserves fd/fclones installation and full pytest,
  # with membership/fork admission before native checkout.
  fd-fclones-integration:
    uses: scitex-ai/.github/.github/workflows/fd-fclones-integration.yml@442f4e5dcd938c0297e36a5f07461d809f9416ff

name: probe-ci-c-fullcopy

# DIAGNOSTIC PROBE: byte-copy of ci.yml's 5 jobs under a different workflow
# name, WITHOUT the concurrency block. If this fails, the 5-job combination
# itself breaks startup; if it runs, the fault is the `ci` slot or concurrency.
on:
  pull_request:
    branches: [develop]

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit

  rtd-sphinx-build:
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main
    secrets: inherit

  fd-fclones-integration:
    uses: scitex-ai/.github/.github/workflows/fd-fclones-integration.yml@442f4e5dcd938c0297e36a5f07461d809f9416ff

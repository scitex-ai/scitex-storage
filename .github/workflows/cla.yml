name: CLA Assistant

# Org-level reusable-workflow caller (scitex-ai/.github, fleet standard).
# Defaults (default_branch=main, owner_allowlist="bot*,ywatanabe1989",
# owner_login=ywatanabe1989) already match this repo — no `with:` overrides
# needed.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    secrets: inherit
